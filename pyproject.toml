[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scenevoice"
version = "0.1.0"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"

[project.scripts]
scenevoice = "scenevoice.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
