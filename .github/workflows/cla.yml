name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Signatures are kept in a separate private repo, so the token here needs no write access.
permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # contributor-assistant/github-action v2.6.1, pinned to its commit
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # fine-grained token with Contents read/write on open-scene-voice-cla only
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-document: "https://github.com/dtbndr/open-scene-voice/blob/main/CLA.md"
          path-to-signatures: "signatures/version1/cla.json"
          branch: "main"
          allowlist: "dtbndr,bot*,dependabot[bot]"
          remote-organization-name: "dtbndr"
          remote-repository-name: "open-scene-voice-cla"
